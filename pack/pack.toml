#:schema ../schemas/pack.schema.json

[pack]
name = "Lampas 2"
version = "2.3.10"
minecraft = "26.2"

[loader]
type = "fabric"
version = "0.19.5"

# Lampas Portal used for manifest blob/release URLs and as the default publish target.
# Overridden by --portal, PORTAL_BASE_URL (manifest) or PACK_PORTAL_URL (publish).
[portal]
base_url = "https://dev.lampas.town"

[launcher]
minimum_version = "1.2.0"
protocol = 3

[launcher.play]
auto_connect = true
server = "play.lampas.town:25576"

[launcher.resourcepacks]
required = ["fresh-animations-extensions", "fresh-animations", "fa-player-extension", "recolourful-containers-gui", "hud-reignited"]

[server.resourcepack]
artifact = "lampas2"
required = true
prompt = '{"text":"The Lampas 2 resource pack"}'

# SnappyTappy project dWOPoahl; retain the approved 26.2 release ISW3ltTi.
[[blacklist]]
scope = "version_id"
provider = "modrinth"
id = "ER3HfIOr"
reason = "SnappyTappy 26.3 is blocked for the Lampas 26.2 pack."
