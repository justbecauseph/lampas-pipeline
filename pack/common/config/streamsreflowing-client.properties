# Streams Reflowing -- Fabric CLIENT configuration (particles / rendering)
# These render on your client only; they have no effect on world generation and are read-but-unused
# on a dedicated server. (On NeoForge/Forge these live in streamsreflowing-client.toml.)

# Ambient particles on the stream fluid: bubbles riding the current + whitewater foam/spray at drops.
#   0 = off.  1 = static (bubbles fade in place; cheapest).  2 = pathed (bubbles flow downstream and
#   follow waterfalls down; default, priciest -- samples the world each tick).
# Perf: CLIENT FPS. Turn down first if streams cost you frames.
# World: safe on an existing world -- applies the moment you save, everywhere.
streamBubbles=2

# How loud running water sounds. Streams murmur when you are beside them, and waterfalls carry --
# a big fall can be heard from a long way off, growing from a distant roar into its full sound as
# you approach. Rides the Ambient volume slider in your sound settings.
#   0 = silent.  1 = normal (default).  Above 1 is louder.
# Perf: client, light.
# World: safe on an existing world -- applies the moment you save, everywhere.
waterAmbience=1.0

# Hard cap on stream particles spawned PER TICK across all nearby stream water -- a safety valve so
# heavy rivers/waterfalls can't flood the particle engine on weaker machines. Default high enough that
# normal play never hits it; lower it if you're chasing frames.
# Perf: CLIENT FPS -- the main particle cost dial. Lower = cheaper.
# World: safe on an existing world -- applies the moment you save, everywhere.
maxStreamParticlesPerTick=500

# How far out (blocks) a client-side scanner hunts for waterfalls to spray, BEYOND vanilla's ~16-block
# ambient-particle range (distant waterfalls are otherwise silent/dry). Distance LOD keeps it cheap:
# the further a waterfall, the FEWER but LARGER particles it fires.   0 = off. Higher = farther (pricier).
# Perf: CLIENT FPS. A larger radius searches more blocks every tick.
# World: safe on an existing world -- applies the moment you save, everywhere.
streamParticleScanRadius=128

# Apply the mod's waterfall whitewater (the distant LOD scanner's spray + foam) to VANILLA water as
# well -- rivers, lakes, vanilla waterfalls -- not just this mod's own streams.
#   true = on (default).  false = only this mod's streams get the whitewater.
# Perf: CLIENT FPS. Extends particle work to all water, not just streams.
# World: safe on an existing world -- applies the moment you save, everywhere.
particlesOnVanillaWater=true

# Floating debris on the stream surface: sticks and (on 1.21.4+) leaves drifting downstream with the
# current. Purely visual and client-side.
#   true = on (default).  false = no sticks or leaves (bubbles and whitewater are unaffected).
# Perf: client, light.
# World: safe on an existing world -- applies the moment you save, everywhere.
streamDebris=true

# PARTICLE SIZE -- how big each droplet of spray is, as a multiplier.
#   1.0 = normal. 2.0 = twice the size. 0.5 = fine mist.
# Spray DENSITY follows size automatically, in inverse square: bigger droplets means proportionally
# fewer of them, so a waterfall throws the same total amount of spray whatever you set here -- the
# same rule the distance detail already uses, so far falls keep matching near ones.
# Perf: CLIENT FPS, but only mildly -- bigger particles are also rarer, so the count stays about the same.
# World: safe on an existing world -- applies the moment you save, everywhere.
particleSize=1.0

# PARTICLE DENSITY -- how much spray is thrown, as a multiplier.
#   1.0 = normal. 2.0 = twice as much water in the air. 0.0 = none.
# This is the dial to turn DOWN for frames, and it is independent of size: the size setting keeps the
# total amount of spray constant, this setting is what changes it.
# Perf: CLIENT FPS -- the most direct particle cost dial there is.
# World: safe on an existing world -- applies the moment you save, everywhere.
particleDensity=1.0

# Show the Streams Reflowing progress line on the world-loading screen while your waterways are
# prepared during world creation. Purely visual and client-side.
#   true = show (default).  false = hide it.
# Perf: none.
# World: safe on an existing world -- applies the moment you save, everywhere.
loadingNotice=false

