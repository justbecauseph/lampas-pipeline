name: Release Modpack & Launcher

on:
  push:
    tags:
      - "v*"
      - "!lampasctl-v*"
      - "lampas-pack-v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Target release channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta
          - dev

jobs:
  release-pack:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate pack definitions
        run: bun run lampasctl validate

      - name: Build published manifests
        run: bun run lampasctl manifest

      - name: Publish to Lampas Portal
        if: vars.PORTAL_URL != ''
        env:
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          PACK_PUBLISH_SECRET: ${{ secrets.PACK_PUBLISH_SECRET }}
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'stable' }}"
          bun run lampasctl publish --portal "$PORTAL_URL" --secret "$PACK_PUBLISH_SECRET" --channel "$CHANNEL"

      - name: Build Linux Launcher Package
        working-directory: ./launcher
        run: |
          bun install
          bun run package:linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            manifest/client-manifest.json
            manifest/server-manifest.json
            manifest/release.json
            launcher/release/*.AppImage
            launcher/release/*.tar.gz
          generate_release_notes: true

  release-windows-launcher:
    name: Build Windows Launcher Installer
    runs-on: windows-latest
    needs: release-pack

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Windows Installer (.exe)
        working-directory: ./launcher
        run: |
          bun install
          bun run package:win

      - name: Upload Windows Installer to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            launcher/release/*.exe
