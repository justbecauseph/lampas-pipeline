name: Headless JVM Smoke Test

on:
  pull_request:
    paths:
      - 'pack/**'
      - 'launcher/src/**'
  workflow_dispatch:

jobs:
  test-bootstrap:
    name: Test Environment & KnotClient Bootstrap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup OpenJDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Install dependencies & validate
        run: |
          bun install
          bun run typecheck
          bun run lampasctl validate
          bun run lampasctl manifest

      - name: Test headless installation sync
        run: bun run lampasctl install --manifest ./manifest/client-manifest.json --target ./ci-test-instance

      - name: Test launcher build
        working-directory: ./launcher
        run: |
          bun install
          bun run build
