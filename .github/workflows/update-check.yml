name: Upstream Modpack Update Checker

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    name: Check Upstream Mod Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Upstream Update Checker
        id: check_updates
        run: |
          bun run tools/lampasctl/src/cli.ts check-updates --apply --markdown update_report.md
          if [ -f update_report.md ]; then
            cat update_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if git diff --quiet -- pack/mods && [ -z "$(git ls-files --others --exclude-standard -- pack/mods)" ]; then
            echo "updates_found=false" >> "$GITHUB_OUTPUT"
          else
            echo "updates_found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-resolve pack and build manifests
        if: steps.check_updates.outputs.updates_found == 'true'
        run: |
          bun run tools/lampasctl/src/cli.ts resolve
          bun run tools/lampasctl/src/cli.ts validate
          bun run tools/lampasctl/src/cli.ts manifest --portal https://dev.lampas.town

      - name: Create Pull Request with Updates
        if: steps.check_updates.outputs.updates_found == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update upstream mod releases"
          title: "chore(deps): upstream modpack updates"
          body-path: update_report.md
          branch: bot/automated-mod-updates
          delete-branch: true
          labels: |
            dependencies
            automated-pr
