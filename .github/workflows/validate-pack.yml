name: Validate Modpack

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate Pack & Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck codebase
        run: bun run typecheck

      - name: Validate pack definitions and lockfile
        run: bun run lampasctl validate

      - name: Build published manifests
        run: bun run lampasctl manifest

      - name: Test headless installation
        run: bun run lampasctl install --manifest ./manifest/client-manifest.json --target ./ci-test-instance
